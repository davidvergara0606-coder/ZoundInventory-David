<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoundInventory - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 400px;">
        <div class="text-center mb-4">
            <h1 class="text-primary fw-bold">ZoundInventory</h1>
            <p class="text-muted">Inicia sesión en el sistema</p>
        </div>
        
        <div class="card bg-secondary bg-opacity-10 border-secondary p-4">
            <form>
                <div class="mb-3">
                    <label class="form-label text-white-50">Correo Electrónico</label>
                    <input type="email" class="form-control bg-dark text-white border-secondary" placeholder="david@correo.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-white-50">Contraseña</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••">
                </div>
                <button type="button" class="btn btn-primary w-100 fw-bold" onclick="alert('¡Listo, David! Luego conectamos la lógica')">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
