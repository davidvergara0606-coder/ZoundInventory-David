<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoundInventory - Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 450px;">
        <div class="text-center mb-4">
            <h1 class="text-primary fw-bold m-0">ZoundInventory</h1>
            <p class="text-muted small">Sistema de Control de Inventarios</p>
        </div>
        
        <div class="card bg-secondary bg-opacity-10 p-4">
            
            <ul class="nav nav-tabs border-secondary mb-4 justify-content-center" id="pestanasAuth" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active bg-transparent border-0 fw-bold text-primary" id="login-tab" data-bs-toggle="tab" data-bs-target="#panel-login" type="button" role="tab">
                        Iniciar Sesión
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link bg-transparent border-0 fw-bold text-white-50" id="registro-tab" data-bs-toggle="tab" data-bs-target="#panel-registro" type="button" role="tab">
                        Registrarse
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="contenidoPestanas">
                
                <div class="tab-pane fade show active" id="panel-login" role="tabpanel">
                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Correo Electrónico</label>
                            <input type="email" class="form-control bg-dark text-white border-secondary" id="loginCorreo" placeholder="nombre@correo.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-white-50 small">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="loginPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Ingresar al Sistema</button>
                    </form>
                </div>

                <div class="tab-pane fade" id="panel-registro" role="tabpanel">
                    <form id="formRegistro">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Nombre Completo</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="regNombre" placeholder="David Vergara" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Correo Electrónico</label>
                            <input type="email" class="form-control bg-dark text-white border-secondary" id="regCorreo" placeholder="david@correo.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="regPassword" placeholder="Crea una contraseña" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-white-50 small">Confirmar Contraseña</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="regPasswordConfirm" placeholder="Repite la contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Crear Cuenta</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

    <script>
        const botonesPestanas = document.querySelectorAll('[data-bs-toggle="tab"]');
        botonesPestanas.forEach(boton => {
            boton.addEventListener('shown.bs.tab', (e) => {
                // Al activar una pestaña, le ponemos color azul y a la otra la dejamos opaca
                botonesPestanas.forEach(b => b.classList.add('text-white-50'));
                e.target.classList.remove('text-white-50');
                e.target.classList.add('text-primary');
            });
        });
    </script>
</body>
</html>
